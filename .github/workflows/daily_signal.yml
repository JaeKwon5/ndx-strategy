name: Daily NDX Regime Dashboard & Signal Notifier

on:
  schedule:
    # 미국장 마감 후 한국시간(KST) 화~토 오전 07:10 자동 실행 (UTC 22:10)
    - cron: '10 22 * * 1-5'
  workflow_dispatch: # GitHub 웹/앱에서 수동 즉시 업데이트 버튼 지원
  push:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt requests

      - name: Run backtest & generate fresh mobile dashboard (index.html)
        run: |
          python ndx_regime_backtest.py

      - name: Send Telegram / KakaoTalk notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          python daily_signal_notifier.py

      - name: Commit updated dashboard & CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dashboard.html backtest_result.csv backtest_summary.csv backtest_equity.png
          git diff --staged --quiet || git commit -m "chore: daily signal & dashboard update"
          git push

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
